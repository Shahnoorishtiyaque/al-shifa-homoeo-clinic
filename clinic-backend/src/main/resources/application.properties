spring.application.name=clinic-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/al_shifa_clinic}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

clinic.admin.name=${CLINIC_ADMIN_NAME:}
clinic.admin.email=${CLINIC_ADMIN_EMAIL:}
clinic.admin.password=${CLINIC_ADMIN_PASSWORD:}

